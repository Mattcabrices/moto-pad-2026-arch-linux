# Moto Pad (archpad): keep the speaker output open while idle (/etc/wireplumber/wireplumber.conf.d/).
# When PipeWire suspends the sink, the codec powers the speaker path down and the four Awinic aw87xxx amps
# (one pair of speakers) are switched off; on the next sound only the other pair comes back. Never suspending keeps
# all four speakers working.
monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_output.*" } ]
    actions = { update-props = { session.suspend-timeout-seconds = 0 } }
  }
]
