// Moto Pad (archpad) Firefox AutoConfig (installed as /usr/lib/firefox/archpad.cfg; first line must be a comment).
// GPU prefs only when started by firefox-gpu inside the GPU desktop (ARCHPAD_GPU=1): Firefox does not recognise
// the Android/Mali EGL driver and would otherwise stay on software WebRender with WebGL off.
if (getenv("ARCHPAD_GPU") == "1") {
  defaultPref("gfx.webrender.all", true);
  defaultPref("gfx.webrender.software", false);
  defaultPref("layers.acceleration.force-enabled", true);
  defaultPref("webgl.force-enabled", true);
}
