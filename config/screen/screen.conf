# Moto Pad screen settings (/etc/archpad/screen.conf), read by archpad-screend and archpad-screen idle.
# Seconds without input before the screen turns off (0 = never).
IDLE=300
# Brightness to use if none was saved (0-255).
BRIGHTNESS=102
# Hall sensor (magnetic cover) key codes, comma-separated; empty = cover ignored. Find them with
# `sudo evtest /dev/input/event5` while closing and opening the cover.
HALL_CLOSE=
HALL_OPEN=
