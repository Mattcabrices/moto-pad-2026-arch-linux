# PipeWire source for the Moto Pad's built-in mic (ALSA card 0, PCM device 10 "Capture_1").
# The ALSA card profile only exposes device 0 (playback), so the mic is declared here.
# The working mic is on the left channel (AIN0); it is presented as a mono source.
context.objects = [
    {   factory = adapter
        args = {
            factory.name           = api.alsa.pcm.source
            node.name              = "pad-builtin-mic"
            node.description       = "Built-in Microphone"
            media.class            = "Audio/Source"
            api.alsa.path          = "hw:0,10"
            audio.format           = "S16LE"
            audio.rate             = 48000
            audio.channels         = 2
            audio.position         = [ FL FR ]
            channelmix.upmix       = false
            node.pause-on-idle     = true
            priority.session       = 2000
        }
    }
]
